name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Build
        run: npm run build

  auth-service-ci:
    name: Auth Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/auth_service
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: './backend/auth_service/go.sum'
          
      - name: Install dependencies
        run: go mod download
        
      - name: Build
        run: go build -v ./...
        
      - name: Test
        run: go test -v ./... || echo "No tests found or tests failed"

  model-service-ci:
    name: Model Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/model_service
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt

  explorer-service-ci:
    name: Explorer Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/explorer_service
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: './backend/explorer_service/go.sum'
          
      - name: Install dependencies
        run: go mod download
        
      - name: Build
        run: go build -v ./...
        
      - name: Test
        run: go test -v ./... || echo "No tests found or tests failed"

  dummy-api-ci:
    name: Dummy API CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/dummy_api
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: './backend/dummy_api/go.sum'
          
      - name: Install dependencies
        run: go mod download
        
      - name: Build
        run: go build -v ./...

  docker-build:
    name: Docker Build & Push
    needs: [frontend-ci, auth-service-ci, model-service-ci, explorer-service-ci, dummy-api-ci]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/tsaqifradhitya/trustchain-frontend:latest
          build-args: |
            VITE_API_BASE_URL=/api/v1
            
      - name: Build and Push Auth Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth_service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/tsaqifradhitya/trustchain-auth-service:latest
          
      - name: Build and Push Model Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/model_service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/tsaqifradhitya/trustchain-model-service:latest
          
      - name: Build and Push Explorer Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/explorer_service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/tsaqifradhitya/trustchain-explorer-service:latest
          
      - name: Build and Push Dummy API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/dummy_api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/tsaqifradhitya/trustchain-dummy-api:latest

  deploy:
    name: Deploy to VPS
    needs: [frontend-ci, auth-service-ci, model-service-ci, explorer-service-ci, dummy-api-ci, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands to Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd /var/www/Trust-Chain-Implementation
            
            # Login to GHCR using the ephemeral GitHub Actions token
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Reset paksa VPS agar sama persis dengan GitHub (mengabaikan perubahan lokal/cache)
            git fetch --all
            git reset --hard origin/main
            
            # Hentikan dan hapus container + network lama (termasuk orphan container)
            docker-compose down --remove-orphans

            # Hapus network yang mungkin tertinggal (mengatasi error "network already exists")
            docker network prune -f
            
            # Pull pre-built images dari GHCR
            docker-compose pull
            
            # Jalankan ulang container dengan force-recreate agar pakai image terbaru
            docker-compose up -d --force-recreate
            
            # Hapus image yang tidak terpakai (dangling) agar hemat storage
            docker image prune -f

