name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# ── Reusable anchor untuk login + buildx setup ────────────────────────────────
# (tidak bisa pakai YAML anchor di GHA, jadi tiap job punya steps sendiri)

jobs:
  # ── CI Jobs (paralel) ────────────────────────────────────────────────────────

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  auth-service-ci:
    name: Auth Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/auth_service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: './backend/auth_service/go.sum'

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./... || echo "No tests found or tests failed"

  model-service-ci:
    name: Model Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/model_service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

  explorer-service-ci:
    name: Explorer Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/explorer_service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: './backend/explorer_service/go.sum'

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./... || echo "No tests found or tests failed"

  dummy-api-ci:
    name: Dummy API CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/dummy_api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: './backend/dummy_api/go.sum'

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

  # ── Docker Build & Push Jobs (paralel, tiap service job sendiri) ─────────────

  docker-frontend:
    name: Docker » Frontend
    needs: frontend-ci
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/tsaqifradhitya/trustchain-frontend:latest
          provenance: false
          build-args: |
            VITE_API_BASE_URL=/api/v1

  docker-auth-service:
    name: Docker » Auth Service
    needs: auth-service-ci
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth_service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/tsaqifradhitya/trustchain-auth-service:latest
          provenance: false

  docker-model-service:
    name: Docker » Model Service
    needs: model-service-ci
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build lokal dulu, push terpisah dengan retry
      # (image ~1GB karena tensorflow — rentan 502 transient GHCR)
      - name: Build Image (local)
        uses: docker/build-push-action@v5
        with:
          context: ./backend/model_service
          push: false
          load: true
          tags: ghcr.io/tsaqifradhitya/trustchain-model-service:latest
          provenance: false

      - name: Push Image (with retry)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: docker push ghcr.io/tsaqifradhitya/trustchain-model-service:latest

  docker-explorer-service:
    name: Docker » Explorer Service
    needs: explorer-service-ci
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/explorer_service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/tsaqifradhitya/trustchain-explorer-service:latest
          provenance: false

  docker-dummy-api:
    name: Docker » Dummy API
    needs: dummy-api-ci
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/dummy_api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/tsaqifradhitya/trustchain-dummy-api:latest
          provenance: false

  # ── Deploy (nunggu semua Docker jobs selesai) ─────────────────────────────────

  deploy:
    name: Deploy to VPS
    needs:
      - docker-frontend
      - docker-auth-service
      - docker-model-service
      - docker-explorer-service
      - docker-dummy-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands to Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd /var/www/Trust-Chain-Implementation

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Reset paksa VPS agar sama persis dengan GitHub
            git fetch --all
            git reset --hard origin/main

            # Hentikan dan hapus container + network lama (termasuk orphan container)
            docker-compose down --remove-orphans

            # Hapus network yang mungkin tertinggal (mengatasi error "network already exists")
            docker network prune -f

            # Pull semua pre-built images dari GHCR
            docker-compose pull

            # Jalankan ulang container dengan force-recreate
            docker-compose up -d --force-recreate

            # Hapus image dangling
            docker image prune -f
